services:
  solana-test-validator:
    build:
      context: .
      dockerfile: Dockerfile.validator
    image: solana-cpi-validator:local
    container_name: solana-test-validator
    ports:
      - "8899:8899"
      - "8900:8900"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8899 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  deployer:
    build:
      context: .
      dockerfile: Dockerfile.deployer
    image: solana-cpi-deployer:local
    container_name: solana-cpi-deployer
    environment:
      - RPC_URL=http://solana-test-validator:8899
    depends_on:
      solana-test-validator:
        condition: service_healthy
    restart: "no"

  relayer-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: solana-cpi-relayer-api:local
    container_name: solana-cpi-relayer-api
    ports:
      - "3000:3000"
    environment:
      - RPC_URL=http://solana-test-validator:8899
      - RELAYER_PORT=3000
      - PROXY_PROGRAM_ID=2em2HY5wgQa1tSz5xQbExEUDNWWBA52KGVzEWNH7oXD7
      - TARGET_PROGRAM_ID=C8dbWuj9rvbUhR4v6Gkh3va8tpQrYvcp7qgE6shYzAoQ
    depends_on:
      deployer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
